<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S. — Live Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="grid-bg" aria-hidden="true"></div>

    <div class="hud conversation-layout">
      <header class="conversation-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>J.A.R.V.I.S.</h1>
            <p class="subtitle">Just A Rather Very Intelligent System</p>
            <div class="header-metrics">
              <div class="metric">
                <span class="metric-label">LINK</span>
                <span id="linkState" class="metric-value">OFFLINE</span>
              </div>
              <div class="metric">
                <span class="metric-label">MODEL</span>
                <span id="modelName" class="metric-value">—</span>
              </div>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <div id="statusPill" class="status-pill standby">STANDBY</div>
          <button
            id="stopBtn"
            class="btn btn-end"
            type="button"
            disabled
            aria-label="End conversation"
          >
            End Conversation
          </button>
        </div>
      </header>

      <div class="conversation-body">
        <aside class="transcript-sidebar" aria-label="Transcription panel">
          <div class="transcript-sidebar-header">
            <div>
              <h2 class="transcript-title">Transcript</h2>
              <p class="transcript-subtitle">Live voice turns</p>
            </div>
          </div>
          <div id="log" class="log transcript-messages" role="log"></div>
        </aside>

        <main class="conversation-main">
          <div class="conversation-stage">
            <div
              id="agentStage"
              class="agent-stage"
              data-state="idle"
              role="region"
              aria-label="AI agent status visualization"
            >
              <div class="agent-ring agent-ring-outer" aria-hidden="true"></div>
              <div class="agent-ring agent-ring-mid" aria-hidden="true"></div>
              <div class="agent-ring agent-ring-glow" aria-hidden="true"></div>
              <div class="agent-orb">
                <span class="agent-orb-label">JARVIS</span>
                <span id="agentStateLabel" class="agent-state-label">Ready</span>
              </div>

              <div id="cameraPreview" class="camera-preview hidden" aria-hidden="true">
                <video id="localVideo" autoplay muted playsinline aria-label="Your camera preview"></video>
              </div>
            </div>

            <p id="statusLine" class="status-line">Awaiting initialization</p>

            <div class="controls">
              <button id="startBtn" class="btn btn-primary" type="button">
                <span class="btn-glow"></span>
                INITIALIZE
              </button>
            </div>
          </div>
        </main>
      </div>

      <footer class="footer-bar">
        <span>OPTIC · AUDIO · NEURAL LINK</span>
        <span class="hint">Edit prompts in <code>prompts/</code></span>
      </footer>

      <aside
        id="productOfferSidebar"
        class="offer-sidebar"
        aria-label="Product recommendations"
        aria-hidden="true"
      >
        <header class="offer-sidebar-header">
          <div>
            <p id="productOfferTag" class="offer-tag">Recommended for you</p>
            <h2 id="productOfferTitle" class="offer-title">—</h2>
          </div>
          <button
            id="productOfferClose"
            class="offer-close-btn"
            type="button"
            aria-label="Close product suggestion"
          >
            ✕
          </button>
        </header>
        <div class="offer-sidebar-body">
          <div class="offer-image-shell">
            <img id="productOfferImage" src="" alt="" class="offer-image" />
          </div>

          <div id="productOfferNav" class="offer-nav hidden" aria-label="Switch product">
            <button id="productOfferPrev" class="offer-nav-btn" type="button" aria-label="Previous item">
              ‹
            </button>
            <div id="productOfferDots" class="offer-dots" role="tablist"></div>
            <button id="productOfferNext" class="offer-nav-btn" type="button" aria-label="Next item">
              ›
            </button>
          </div>

          <div class="offer-meta">
            <p id="productOfferPrice" class="offer-price">—</p>
            <p id="productOfferDescription" class="offer-copy">—</p>
            <button class="btn btn-primary offer-cta" type="button">VIEW DETAILS</button>
          </div>
        </div>
      </aside>

      <button
        id="productOfferFab"
        class="offer-fab"
        type="button"
        aria-label="Show yellow dress recommendation"
      >
        🛍️
      </button>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
